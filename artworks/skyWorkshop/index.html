<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="An interactive hand-drawn airborne workshop starring a pelican, a polar bear, Qin Shi Huang, and Sun Wukong.">
  <title>The Great Sky Workshop</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23f6c542' stroke='%231b2538' stroke-width='2' d='M5 18c4-8 12-11 22-7-4 1-7 3-8 7 4 0 7 2 8 5-8-3-15-2-22 1 2-2 2-4 0-6Z'/%3E%3C/svg%3E">
  <style>
    :root {
      --ink: #17243c;
      --paper: #f8f3e7;
      --sun: #f4bd37;
      --coral: #ef6a55;
      --sky: #82d7e9;
      --sky-deep: #2289ab;
      --cream: #fff8e6;
      --blue: #286bad;
      --speed: 1;
      --tilt-x: 0deg;
      --tilt-y: 0deg;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      color: var(--ink);
      background: #1b87a7;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }

    .page {
      position: relative;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 78% 17%, rgba(255,255,255,.68) 0 2%, transparent 2.2%),
        linear-gradient(180deg, #8fe1ee 0%, #6fcfe3 44%, #e7f8f4 100%);
      isolation: isolate;
    }

    .paper-noise {
      position: absolute;
      inset: 0;
      opacity: .15;
      pointer-events: none;
      z-index: 9;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.32'/%3E%3C/svg%3E");
      mix-blend-mode: multiply;
    }

    .topbar {
      position: absolute;
      inset: 0 0 auto;
      z-index: 20;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 2rem;
      padding: clamp(1rem, 3vw, 2.2rem) clamp(1rem, 4vw, 4rem);
      pointer-events: none;
    }

    .title-block { max-width: 36rem; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      margin-bottom: .45rem;
      font-size: .76rem;
      font-weight: 800;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      content: "";
      width: 1.7rem;
      height: 3px;
      background: var(--coral);
      border-radius: 3px;
      transform: rotate(-2deg);
    }

    h1 {
      margin: 0;
      max-width: 10ch;
      color: #11233d;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.3rem, 5.7vw, 5.6rem);
      line-height: .83;
      letter-spacing: -.055em;
      text-shadow: 0 3px 0 rgba(255,255,255,.38);
    }

    .subtitle {
      margin: .8rem 0 0;
      max-width: 33rem;
      font-size: clamp(.88rem, 1.45vw, 1.05rem);
      line-height: 1.35;
      font-weight: 700;
    }

    .altimeter {
      display: grid;
      place-items: center;
      width: 7.7rem;
      aspect-ratio: 1;
      padding: .7rem;
      border: 3px solid var(--ink);
      border-radius: 50% 47% 49% 46%;
      background: rgba(255,248,230,.88);
      box-shadow: 5px 7px 0 rgba(23,36,60,.2), inset 0 0 0 4px #e6d8b9;
      transform: rotate(3deg);
    }

    .altimeter span { font-size: .64rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .altimeter strong { font-family: Georgia, serif; font-size: 1.8rem; line-height: 1; }

    .scene-wrap {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      perspective: 1100px;
    }

    .scene {
      width: min(1320px, 120vw);
      height: auto;
      max-height: 100svh;
      overflow: visible;
      transform: rotateX(var(--tilt-x)) rotateY(var(--tilt-y));
      transform-origin: 55% 55%;
      transition: transform .45s cubic-bezier(.2,.8,.2,1);
      filter: drop-shadow(0 28px 24px rgba(23,61,78,.18));
    }

    .sketch {
      stroke: var(--ink);
      stroke-width: 4;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .thin { stroke-width: 2.2; }
    .no-fill { fill: none; }

    .cloud { animation: drift calc(var(--cloud-time) / var(--speed)) linear infinite; }
    .cloud:nth-of-type(2) { animation-delay: -7s; }
    .cloud:nth-of-type(3) { animation-delay: -13s; }
    @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(130px); } }

    .plane { animation: hover calc(4.8s / var(--speed)) ease-in-out infinite; transform-origin: 730px 620px; }
    @keyframes hover { 0%,100% { transform: translateY(0) rotate(.15deg); } 50% { transform: translateY(-8px) rotate(-.25deg); } }

    .propeller { animation: spin calc(.24s / var(--speed)) linear infinite; transform-origin: 1185px 584px; }
    .wheel { animation: spin calc(.9s / var(--speed)) linear infinite; }
    .wheel.back { transform-origin: 470px 584px; }
    .wheel.front { transform-origin: 680px 584px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .pelican-body { animation: pedalBob calc(1.8s / var(--speed)) ease-in-out infinite; transform-origin: 575px 500px; }
    @keyframes pedalBob { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(-1deg); } }

    .wing-left { animation: flapLeft calc(2.4s / var(--speed)) ease-in-out infinite; transform-origin: 535px 396px; }
    .wing-right { animation: flapRight calc(2.4s / var(--speed)) ease-in-out infinite; transform-origin: 606px 395px; }
    @keyframes flapLeft { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-7deg); } }
    @keyframes flapRight { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(7deg); } }

    .scarf { animation: scarf calc(1.2s / var(--speed)) ease-in-out infinite alternate; transform-origin: 914px 418px; }
    @keyframes scarf { from { transform: rotate(-2deg) scaleX(.98); } to { transform: rotate(5deg) scaleX(1.07); } }

    .screw-arm { animation: tighten calc(1.1s / var(--speed)) ease-in-out infinite; transform-origin: 576px 277px; }
    @keyframes tighten { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(12deg); } }

    .wukong-arm { animation: wave calc(1.8s / var(--speed)) ease-in-out infinite; transform-origin: 1046px 408px; }
    @keyframes wave { 0%,100% { transform: rotate(-7deg); } 50% { transform: rotate(13deg); } }

    .speed-line { animation: streak calc(1.35s / var(--speed)) linear infinite; stroke-dasharray: 18 22; }
    @keyframes streak { to { stroke-dashoffset: -80; } }

    .control-deck {
      position: absolute;
      right: clamp(1rem, 4vw, 4rem);
      bottom: clamp(1rem, 3vw, 2.3rem);
      z-index: 30;
      display: grid;
      grid-template-columns: auto auto;
      gap: .65rem;
      width: min(29rem, calc(100vw - 2rem));
      padding: .85rem;
      border: 3px solid var(--ink);
      border-radius: 18px 15px 20px 14px;
      background: rgba(255,248,230,.94);
      box-shadow: 7px 8px 0 rgba(23,36,60,.22);
      transform: rotate(-.4deg);
      backdrop-filter: blur(8px);
    }

    .control-deck button {
      min-height: 3rem;
      border: 2px solid var(--ink);
      border-radius: 12px 10px 14px 9px;
      color: var(--ink);
      background: #fffdf4;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--ink);
      transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
    }

    .control-deck button:hover { background: #ffdc78; transform: translate(-1px,-1px) rotate(-1deg); box-shadow: 5px 5px 0 var(--ink); }
    .control-deck button:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }
    .control-deck button:focus-visible, input:focus-visible { outline: 4px solid var(--coral); outline-offset: 3px; }
    .control-deck button[aria-pressed="true"] { background: var(--sun); }

    .speed-control {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: .75rem;
      padding: .35rem .35rem 0;
      font-size: .78rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    input[type="range"] { width: 100%; accent-color: var(--coral); cursor: ew-resize; }
    output { min-width: 3.4ch; font-variant-numeric: tabular-nums; }

    .caption {
      position: absolute;
      left: clamp(1rem, 4vw, 4rem);
      bottom: clamp(1rem, 3vw, 2.3rem);
      z-index: 15;
      max-width: 24rem;
      padding: .55rem .85rem;
      border-left: 4px solid var(--coral);
      background: rgba(255,255,255,.33);
      font-family: Georgia, serif;
      font-size: clamp(.8rem, 1.2vw, .98rem);
      font-style: italic;
      line-height: 1.35;
    }

    .paused * { animation-play-state: paused !important; }
    .gusting .speed-line { animation-duration: .25s; }
    .gusting .plane { animation: gust .8s ease-in-out; }
    @keyframes gust { 0%,100% { transform: translate(0,0) rotate(0); } 30% { transform: translate(-18px,-11px) rotate(-1.4deg); } 65% { transform: translate(12px,7px) rotate(.8deg); } }

    .spark { animation: spark .7s ease-out forwards; transform-origin: center; }
    @keyframes spark { 0% { transform: scale(.2) rotate(0); opacity: 1; } 100% { transform: scale(2.2) rotate(80deg); opacity: 0; } }

    @media (max-width: 760px) {
      .page { min-height: 860px; }
      .topbar { padding: 1rem; }
      h1 { max-width: 8ch; font-size: clamp(2.5rem, 13vw, 4rem); }
      .subtitle { max-width: 18rem; font-size: .82rem; }
      .altimeter { width: 5.2rem; }
      .altimeter strong { font-size: 1.2rem; }
      .scene-wrap { top: 11rem; bottom: 8rem; }
      .scene { width: 128vw; max-width: none; transform: translateX(-12%) rotateX(var(--tilt-x)) rotateY(var(--tilt-y)); }
      .caption { display: none; }
      .control-deck { left: 1rem; right: 1rem; bottom: 1rem; width: auto; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
      .scene { transition: none; }
    }
  </style>
</head>

            <path class="sketch" fill="#86939b" d="m658 329 23-9 8 16-26 9Z"/>
            <path class="sketch thin no-fill" d="m671 328 6 8m-136-49-8 34m83-35 10 36"/>
            <path class="sketch" fill="#242c48" d="m524 316 44-4 4 20-52 3Zm73-4 43 6 1 19-49-6Z"/>
          </g>

          <g opacity=".23" fill="url(#hatch)">
            <path d="m146 614 474-93 471 60-762 108-184-42Z"/>
            <path d="M792 518c96-98 286-109 401-31 49 34 50 93 0 126-73 47-238 44-374 12l-95-56 68-51Z"/>
          </g>
        </g>

        <g id="sparks" pointer-events="none"></g>
      </svg>
    </div>

    <p class="caption">“Tighten clockwise,” shouted the Emperor. “Pedal clockwise,” answered the pelican.</p>

    <section class="control-deck" aria-label="Flight controls">
      <button id="pauseButton" type="button" aria-pressed="false">❚❚ Pause flight</button>
      <button id="gustButton" type="button">↝ Summon gust</button>
      <button id="screwButton" type="button">✦ Tighten screw</button>
      <button id="tiltButton" type="button" aria-pressed="false">◩ 3D tilt</button>
      <label class="speed-control" for="speedRange">
        <span>Motion</span>
        <input id="speedRange" type="range" min="0.5" max="2" value="1" step="0.1">
        <output id="speedOutput" for="speedRange">1.0×</output>
      </label>
    </section>

    <div class="paper-noise" aria-hidden="true"></div>
  </main>

  <script>
    const page = document.querySelector("#page");
    const pauseButton = document.querySelector("#pauseButton");
    const gustButton = document.querySelector("#gustButton");
    const screwButton = document.querySelector("#screwButton");
    const tiltButton = document.querySelector("#tiltButton");
    const speedRange = document.querySelector("#speedRange");
    const speedOutput = document.querySelector("#speedOutput");
    const sparks = document.querySelector("#sparks");

    let tiltEnabled = false;
    let gustTimer = 0;

    // 暂停状态挂在场景根节点，确保所有 CSS 动画保持同一时间线并可无损恢复。
    pauseButton.addEventListener("click", () => {
      const paused = page.classList.toggle("paused");
      pauseButton.setAttribute("aria-pressed", String(paused));
      pauseButton.textContent = paused ? "▶ Resume flight" : "❚❚ Pause flight";
    });

    // 阵风只影响一次飞行动作；重入时刷新计时器，避免类名被旧计时器过早移除。
    gustButton.addEventListener("click", () => {
      window.clearTimeout(gustTimer);
      page.classList.remove("gusting");
      void page.offsetWidth;
      page.classList.add("gusting");
      gustTimer = window.setTimeout(() => page.classList.remove("gusting"), 850);
    });

    // 火花使用 SVG 原生几何，创建后立即回收，避免连续点击积累不可见节点。
    function createSpark(angle) {
      const namespace = "http://www.w3.org/2000/svg";
      const path = document.createElementNS(namespace, "path");
      path.setAttribute("class", "spark");
      path.setAttribute("d", "M675 326l5 9 10 1-8 7 3 10-10-5-9 6 2-11-8-6 11-2Z");
      path.setAttribute("fill", angle % 2 ? "#ef6a55" : "#f4bd37");
      path.setAttribute("transform", `rotate(${angle} 675 336)`);
      sparks.append(path);
      window.setTimeout(() => path.remove(), 750);
    }

    // 单次拧紧生成五枚错峰火花，让反馈清晰但不持续遮挡人物动作。
    screwButton.addEventListener("click", () => {
      [0, 72, 144, 216, 288].forEach((angle, index) => {
        window.setTimeout(() => createSpark(angle), index * 45);
      });
    });

    // 统一倍率变量由全部动画共享，调速不会打断各部件当前动画相位。
    speedRange.addEventListener("input", () => {
      const speed = Number(speedRange.value);
      document.documentElement.style.setProperty("--speed", String(speed));
      speedOutput.value = `${speed.toFixed(1)}×`;
    });

    // 关闭 3D 倾斜时显式归零，避免场景停留在最后一次指针姿态。
    tiltButton.addEventListener("click", () => {
      tiltEnabled = !tiltEnabled;
      tiltButton.setAttribute("aria-pressed", String(tiltEnabled));
      if (!tiltEnabled) {
        document.documentElement.style.setProperty("--tilt-x", "0deg");
        document.documentElement.style.setProperty("--tilt-y", "0deg");
      }
    });

    // 指针位置映射到有限角度，保持立体感但避免移动端或边缘位置产生眩晕式旋转。
    page.addEventListener("pointermove", (event) => {
      if (!tiltEnabled) return;
      const horizontal = (event.clientX / window.innerWidth - .5) * 7;
      const vertical = (.5 - event.clientY / window.innerHeight) * 5;
      document.documentElement.style.setProperty("--tilt-x", `${vertical.toFixed(2)}deg`);
      document.documentElement.style.setProperty("--tilt-y", `${horizontal.toFixed(2)}deg`);
    });
  </script>
</body>
</html>

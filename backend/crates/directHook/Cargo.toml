[package]
name = "codexmanager-direct-hook"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[lib]
name = "cphook"
crate-type = ["cdylib"]

[dependencies]
cpcommon = { package = "codexmanager-direct-common", path = "../directCommon" }
serde_json = "1"
base64 = "0.22"
rustls-pki-types = { version = "1", features = ["std"] }
url = "2"

[target.'cfg(windows)'.dependencies]
retour = "0.3"
windows = { version = "0.58", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_SystemServices",
    "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem", "Win32_Networking_WinHttp", "Win32_System_Environment"
] }

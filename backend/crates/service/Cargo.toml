[package]
name = "codexmanager-service"
version.workspace = true
edition = "2021"

[dependencies]
codexmanager-core = { path = "../core" }
cpcommon = { package = "codexmanager-direct-common", path = "../directCommon" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
toml_edit = "0.22"
rusqlite = { path = "../rusqlite", features = ["bundled", "backup"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking", "stream", "socks"] }
hyper-util = { version = "0.1", features = ["client-proxy", "client-proxy-system", "server-auto", "tokio"] }
# 内置观测复用现有协议栈；正文旁路解析不进入账号池或计费链。
hyper = { version = "1", features = ["server", "http1", "http2"] }
tokio-rustls = "0.26"
rcgen = { version = "0.13", features = ["x509-parser"] }
time = "0.3"
http-body-util = "0.1"
async-compression = { version = "0.4", features = ["tokio", "gzip", "zlib", "brotli", "zstd"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
bytes = "1"
rand = "0.8"
sha2 = "0.10"
tiny_http = "0.12"
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
futures-util = "0.3"
eventsource-stream = "0.2.3"
tokio-tungstenite = { version = "0.28", features = ["proxy", "rustls-tls-webpki-roots"] }
tungstenite = { version = "0.27", features = ["deflate", "proxy"] }
rustls = { version = "0.23", features = ["ring"] }
webpki-roots = "1"
url = "2"
webbrowser = "0.8"
urlencoding = "2"
log = "0.4"
libc = "0.2"
env_logger = "0.11"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ed25519-dalek = { version = "2", features = ["pkcs8"] }
crypto_box = { version = "0.9.1", features = ["seal"] }
croner = "3.0.1"
zstd = "0.13"
os_info = "3.12.0"
rhai = "1"
sysinfo = "0.30"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_Security",
] }


[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[[example]]
name = "observationReadyFixture"
path = "tests/observation/readyFixture.rs"
crate-type = ["cdylib"]

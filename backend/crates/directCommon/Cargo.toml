[package]
name = "codexmanager-direct-common"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[lib]
name = "cpcommon"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
serde_json = "1"

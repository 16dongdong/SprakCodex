[package]
name = "codexmanager-direct-common"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[lib]
name = "cpcommon"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_Security"] }

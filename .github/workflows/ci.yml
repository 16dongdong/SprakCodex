name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CARGO_NET_RETRY: "3"

jobs:
  rust_workspace:
    name: Rust workspace and WebSocket pin validation
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Check WebSocket dependency pins
        run: bash backend/scripts/ci/check-websocket-pins.sh

      - name: Check formatting
        run: cargo fmt --manifest-path backend/Cargo.toml --all -- --check

      - name: Check workspace targets
        run: cargo check --manifest-path backend/Cargo.toml --workspace --all-targets

      - name: Test Responses WebSocket regressions
        run: |
          cargo test --manifest-path backend/Cargo.toml -p codexmanager-service --lib official_responses_websocket_ --no-fail-fast
          cargo test --manifest-path backend/Cargo.toml -p codexmanager-service --lib send_websocket_upstream_request_ --no-fail-fast

  frontend_and_web:
    name: Frontend build and Web service tests
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: Fetch Rust dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo fetch --manifest-path backend/Cargo.toml --locked; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend static output
        working-directory: frontend
        run: pnpm run build:desktop

      - name: Test Web service
        run: cargo test --manifest-path backend/Cargo.toml -p codexmanager-web --no-fail-fast

  tauri_macos:
    name: Tauri macOS arm64 bundle
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup release environment
        uses: ./.github/actions/setup-release-env
        with:
          rust-target: aarch64-apple-darwin
          enable-pnpm-cache: "false"

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend static output
        working-directory: frontend
        run: pnpm run build:desktop

      - name: Build Tauri app bundle
        uses: ./.github/actions/build-tauri-with-retry
        with:
          working-directory: frontend
          tauri-cli-version: 2.10.1
          bundles: app
          target: aarch64-apple-darwin
          shell-type: bash
          max-attempts: "1"
